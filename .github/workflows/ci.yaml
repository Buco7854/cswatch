name: Verify and rebuild
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            tools/assets/package-lock.json
            tools/transcription/package-lock.json
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend && npm ci --prefix tools/assets && npm ci --prefix tools/transcription
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: node scripts/fetch-test-demo.mjs
      - name: Prepare checksum-pinned offline CPU speech model
        run: node tools/transcription/prepare-model.mjs --out var/transcription-models/whisper-tiny
      - run: npm run format:check && npm run check:locales && npm run build && npm test && npm run test:assets
        env:
          CSWATCH_TRANSCRIPTION_TEST_MODEL: ${{ github.workspace }}/var/transcription-models/whisper-tiny
      - name: Prepare public speech replay fixture for container verification
        run: node tools/transcription/verify-transcription.mjs --model var/transcription-models/whisper-tiny --keep-job var/transcription-jfk-job
      - run: npm audit --prefix backend --omit=dev --audit-level=high && npm audit --prefix frontend --omit=dev --audit-level=high && npm audit --prefix tools/assets --omit=dev --audit-level=high && npm audit --prefix tools/transcription --audit-level=high
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Private instance, registrations closed
        run: npm run test:e2e
        env:
          E2E_PRIVATE: '1'
          E2E_REGISTRATIONS: 'false'
      - name: Private instance, registrations open
        run: npm run test:e2e
        env:
          E2E_PRIVATE: '1'
          E2E_REGISTRATIONS: 'true'
      - name: First administrator enrollment
        run: npm --prefix frontend run test:e2e -- tests/setup.spec.ts
        env:
          E2E_SETUP: '1'
      - name: Validate published-image Compose deployment
        run: docker compose --env-file .env.example --profile transcription --profile maintenance config --no-env-resolution --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build identity
        id: build-identity
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: cswatch:verify
          load: true
          pull: true
          build-args: |
            CSWATCH_REVISION=${{ github.sha }}
            CSWATCH_BUILD_TIMESTAMP=${{ steps.build-identity.outputs.created }}
      - name: Verify the runtime and health endpoint
        env:
          CSWATCH_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test "$(docker image inspect cswatch:verify --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$CSWATCH_EXPECTED_REVISION"
          docker run -d --name cswatch-smoke -e APP_URL=http://localhost:8000 -e COOKIE_SECURE=false -p 8000:8000 cswatch:verify
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              node scripts/verify-image-build.mjs
              exit 0
            fi
            sleep 2
          done
          docker logs cswatch-smoke
          exit 1
      - name: Verify isolated parsing and replay in the hardened image
        run: |
          chmod a+rx var/fixture
          chmod a+r var/fixture/input.dem
          chmod -R a+rX var/transcription-models/whisper-tiny var/transcription-jfk-job
          docker run --rm -i --read-only --network none --cap-drop=ALL --security-opt no-new-privileges --pids-limit 128 --memory 5g --cpus 2 -e CSWATCH_REQUIRE_ASR_SMOKE=true --tmpfs /tmp:rw,size=3g,mode=1777 --mount type=bind,source="$PWD/var/fixture",target=/fixture,readonly --mount type=bind,source="$PWD/var/transcription-models/whisper-tiny",target=/models,readonly --mount type=bind,source="$PWD/var/transcription-jfk-job",target=/voice-fixture,readonly cswatch:verify node --input-type=module < scripts/runtime-smoke.mjs
      - name: Build the isolated asset-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: assets
          push: false
          tags: cswatch:verify-assets
          load: true
          pull: true
          build-args: |
            CSWATCH_REVISION=${{ github.sha }}
            CSWATCH_BUILD_TIMESTAMP=${{ steps.build-identity.outputs.created }}
      - name: Verify hardened asset confinement, queue and atomic publication
        run: |
          test "$(docker image inspect cswatch:verify-assets --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = '${{ github.sha }}'
          node scripts/asset-runtime-smoke.mjs --prepare-catalog var/asset-runtime-smoke-catalog
          docker run --rm -i --read-only --network none --cap-drop=ALL --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 --tmpfs /tmp:rw,size=16m,mode=1777 --tmpfs /map-catalog:rw,size=1m,mode=0750,uid=1000,gid=1000 cswatch:verify-assets node tools/assets/update-map-catalog.mjs < var/asset-runtime-smoke-catalog/catalog.json
          docker run --rm -i --init --read-only --network none --cap-drop=ALL --security-opt no-new-privileges --pids-limit 128 --memory 8g --cpus 2 -e CSWATCH_ASSET_SMOKE_CONTAINER=true --tmpfs /tmp:rw,size=256m,mode=1777 --tmpfs /map-assets:rw,size=1g,mode=0750,uid=1000,gid=1000 --tmpfs /map-jobs:rw,size=16m,mode=0750,uid=1000,gid=1000 --tmpfs /map-cache:rw,size=1g,mode=0750,uid=1000,gid=1000 --mount type=bind,source="$PWD/var/asset-runtime-smoke-catalog",target=/map-catalog,readonly cswatch:verify-assets node --input-type=module < scripts/asset-runtime-smoke.mjs
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          build-args: |
            CSWATCH_REVISION=${{ github.sha }}
            CSWATCH_BUILD_TIMESTAMP=${{ steps.image.outputs.created }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ github.run_number }}
          provenance: true
          sbom: true
      - name: Publish the asset-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: assets
          push: true
          pull: true
          no-cache: true
          build-args: |
            CSWATCH_REVISION=${{ github.sha }}
            CSWATCH_BUILD_TIMESTAMP=${{ steps.image.outputs.created }}
          tags: |
            ${{ steps.image.outputs.name }}:assets-latest
            ${{ steps.image.outputs.name }}:assets-sha-${{ github.sha }}-${{ github.run_number }}
          provenance: true
          sbom: true
