name: Verify and rebuild
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            tools/assets/package-lock.json
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend && npm ci --prefix tools/assets
      - run: node scripts/fetch-test-demo.mjs
      - run: npm run format:check && npm run check:locales && npm run build && npm test
      - run: npm audit --prefix backend --omit=dev --audit-level=high && npm audit --prefix frontend --omit=dev --audit-level=high && npm audit --prefix tools/assets --omit=dev --audit-level=high
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Private instance, registrations closed
        run: npm run test:e2e
        env:
          E2E_PRIVATE: '1'
          E2E_REGISTRATIONS: 'false'
      - name: Private instance, registrations open
        run: npm run test:e2e
        env:
          E2E_PRIVATE: '1'
          E2E_REGISTRATIONS: 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: cswatch:verify
          load: true
          pull: true
      - name: Verify the runtime and health endpoint
        run: |
          docker run -d --name cswatch-smoke -e APP_URL=http://localhost:8000 -e COOKIE_SECURE=false -p 8000:8000 cswatch:verify
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs cswatch-smoke
          exit 1
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ github.run_number }}
          provenance: true
          sbom: true
