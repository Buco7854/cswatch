version: 2
updates:
  # One grouped pull request a month for every npm lockfile in the repository.
  - package-ecosystem: npm
    directories: ['/', '/backend', '/frontend', '/tools/assets', '/tools/transcription']
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups:
      docker: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions: { patterns: ['*'] }
