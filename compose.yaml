name: cswatch
x-isolated: &isolated
  restart: unless-stopped
  read_only: true
  user: '1000:1000'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs:
    - /tmp:size=768m,mode=1777
  stop_grace_period: 20s
x-app: &app
  <<: *isolated
  image: ${CSWATCH_IMAGE:-ghcr.io/buco7854/cswatch:latest}
  volumes:
    - cswatch-data:/data
services:
  web:
    <<: *app
    ports:
      - '${HOST_BIND_IP:-0.0.0.0}:${HOST_PORT:-8000}:8000'
    # Bare names forward configured values. Omitted policy flags stay configurable in Administration.
    environment:
      - APP_URL=${APP_URL:?Set APP_URL to your public origin in .env}
      - COOKIE_SECURE
      - TRUSTED_PROXY_IPS
      - ADMIN_ALLOWED_IPS
      - LOG_LEVEL
      - PUBLIC_ACCESS
      - GUEST_UPLOADS_ENABLED
      - REGISTRATIONS_ENABLED
      - STEAM_ENABLED
      - FACEIT_ENABLED
      - EMAIL_DELIVERY_ENABLED
      - TRANSCRIPTION_ENABLED
      - AUTO_OFFICIAL_MAPS_ENABLED
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - ADMIN_EMAIL
      - MFA_REQUIRED_ROLES
      - SESSION_DAYS
      - ENCRYPTION_KEY
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_FROM
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - STEAM_API_KEY
      - FACEIT_API_KEY
      - FACEIT_DOWNLOAD_TOKEN
      - FACEIT_RESOURCE_HOSTS
      - FACEIT_SIGNED_DOWNLOAD_HOSTS
      - MAX_UPLOAD_MB
      - MAX_EXPANDED_MB
      - USER_DEMO_LIMIT
      - USER_STORAGE_MB
      - GLOBAL_STORAGE_MB
      - RETENTION_DAYS
      - GUEST_RETENTION_HOURS
      - GUEST_DEMO_LIMIT
      - GUEST_STORAGE_MB
      - PARSER_TIMEOUT_SECONDS
      - PARSER_MEMORY_MB
      - PARSER_SANDBOX
      - PARSER_SANDBOX_BINARY
      - TRANSCRIPTION_MODEL_DIR
      - TRANSCRIPTION_LANGUAGE
      - TRANSCRIPTION_TIMEOUT_SECONDS
      - TRANSCRIPTION_MAX_AUDIO_SECONDS
      - MAP_ASSETS_DIR=/map-assets
      - MAP_JOBS_DIR=/map-jobs
      - MAP_CATALOG_FILE=/map-catalog/catalog.json
    volumes:
      - cswatch-data:/data
      - cswatch-map-assets:/map-assets:ro
      - cswatch-map-jobs:/map-jobs
      - cswatch-map-catalog:/map-catalog:ro
    mem_limit: 1536m
    cpus: 2
  worker:
    <<: *app
    command: [node, dist/worker.js]
    # Both offline roles run housekeeping and use the same quotas, deadlines and subtitle policy.
    environment:
      - WORKER_ROLE=parse
      - APP_URL=${APP_URL:?Set APP_URL to your public origin in .env}
      - COOKIE_SECURE
      - LOG_LEVEL
      - MAX_UPLOAD_MB
      - MAX_EXPANDED_MB
      - USER_STORAGE_MB
      - GLOBAL_STORAGE_MB
      - GUEST_STORAGE_MB
      - RETENTION_DAYS
      - PARSER_TIMEOUT_SECONDS
      - PARSER_MEMORY_MB
      - PARSER_SANDBOX
      - PARSER_SANDBOX_BINARY
      - TRANSCRIPTION_ENABLED
      - TRANSCRIPTION_MODEL_DIR
      - TRANSCRIPTION_TIMEOUT_SECONDS
    network_mode: none
    mem_limit: 5g
    cpus: 2
    healthcheck:
      disable: true
    stop_grace_period: 330s
  transcription:
    extends: worker
    profiles: [transcription]
    environment:
      - WORKER_ROLE=transcription
      - TRANSCRIPTION_LANGUAGE
      - TRANSCRIPTION_MAX_AUDIO_SECONDS
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 20s
  assets:
    <<: *isolated
    init: true
    image: ${CSWATCH_ASSETS_IMAGE:-ghcr.io/buco7854/cswatch:assets-latest}
    environment:
      MAP_ASSETS_DIR: /map-assets
      MAP_JOBS_DIR: /map-jobs
      MAP_CACHE_DIR: /map-cache
      MAP_CATALOG_FILE: /map-catalog/catalog.json
    networks: [asset-egress]
    volumes:
      - cswatch-map-assets:/map-assets
      - cswatch-map-jobs:/map-jobs
      - cswatch-map-catalog:/map-catalog:ro
      - cswatch-map-cache:/map-cache
    mem_limit: 8g
    cpus: 2
    stop_grace_period: 30s
  catalog:
    <<: *isolated
    image: ${CSWATCH_ASSETS_IMAGE:-ghcr.io/buco7854/cswatch:assets-latest}
    profiles: [maintenance]
    restart: 'no'
    network_mode: none
    command: [node, tools/assets/update-map-catalog.mjs]
    environment:
      MAP_CATALOG_FILE: /map-catalog/catalog.json
    volumes:
      - cswatch-map-catalog:/map-catalog
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 1
    healthcheck:
      disable: true
volumes:
  cswatch-data:
  cswatch-map-assets:
  cswatch-map-jobs:
  cswatch-map-catalog:
  cswatch-map-cache:
networks:
  asset-egress:
